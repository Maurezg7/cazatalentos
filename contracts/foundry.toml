[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.ci]
fuzz = { runs = 5000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
# Third-party libraries ship their own formatting. Do not reformat them.
ignore = ["lib/**"]
